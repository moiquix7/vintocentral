<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IASD Vinto Central - Inventario</title>
    <script>
      // GitHub Pages serves this file for unknown paths. Send the user back to the app's login page.
      (function () {
        var firstSegment = location.pathname.split('/')[1];
        var isProjectPage = /\.github\.io$/.test(location.hostname) && firstSegment;
        var base = isProjectPage ? '/' + firstSegment + '/' : '/';
        location.replace(base + '#/login');
      })();
    </script>
  </head>
  <body>
    <p><a href="./#/login">Ir a la página de ingreso</a></p>
  </body>
</html>
