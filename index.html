<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Inventario de artículos de la Iglesia Adventista del Séptimo Día" />
    <meta name="theme-color" content="#2f6f7e" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>IASD Vinto Central - Inventario</title>
    <link rel="icon" href="static/img/logo-iasd.png" type="image/png" />
    <link rel="apple-touch-icon" href="static/img/logo-iasd.png" />
    <script>
      // Apply saved appearance before the first paint (no flash of the wrong theme/colors).
      // Same storage key and values as js/core/preferences.js.
      (function () {
        var root = document.documentElement;
        var prefs = {};
        try { prefs = JSON.parse(localStorage.getItem('vintocentral.preferences') || '{}') || {}; } catch (e) { prefs = {}; }
        var dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = prefs.theme === 'light' || prefs.theme === 'dark' ? prefs.theme : (dark ? 'dark' : 'light');
        var palettes = ['teal', 'sage', 'lavender', 'terracotta', 'sky'];
        root.setAttribute('data-theme', theme);
        root.setAttribute('data-palette', palettes.indexOf(prefs.palette) >= 0 ? prefs.palette : 'teal');
        root.setAttribute('data-focus-mode', prefs.focusMode === true ? 'on' : 'off');
        root.setAttribute('data-font-scale', ['large', 'xlarge'].indexOf(prefs.fontScale) >= 0 ? prefs.fontScale : 'normal');
      })();
    </script>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <div id="app" aria-busy="true">
      <!-- Static copy of inventoryLoader() (js/core/dom.js): shown until the app starts. -->
      <div class="boot">
        <div class="inv-loader inv-loader--large" role="status">
          <svg class="inv-loader-art" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
            <path class="inv-box" d="M9 19h30v20a3 3 0 0 1-3 3H12a3 3 0 0 1-3-3z" />
            <path class="inv-lid" d="M7 12h34v7H7z" />
            <path class="inv-code" d="M17 26v9M20 26v9M24 26v9M27 26v9M31 26v9" />
            <path class="inv-scan" d="M14 26h20" />
          </svg>
          <span class="inv-loader-text">Cargando…</span>
        </div>
      </div>
    </div>
    <div id="toasts" class="toast-region" aria-live="polite"></div>
    <script>
      // Opened with a double click (file://): browsers block ES modules there, so js/main.js never
      // loads. Explain how to open the app instead of leaving "Cargando…" on screen forever.
      if (location.protocol === 'file:') {
        document.getElementById('app').innerHTML =
          '<div class="boot"><div class="card" style="max-width:520px;text-align:left">' +
          '<h1>Abra la aplicación desde el servidor</h1>' +
          '<p>Este archivo no se puede abrir con doble clic: el navegador bloquea sus módulos por seguridad.</p>' +
          '<ol><li>En una terminal, dentro de la carpeta del proyecto, ejecute <code>npm start</code>.</li>' +
          '<li>Abra <a href="http://localhost:8080">http://localhost:8080</a>.</li></ol></div></div>';
        document.getElementById('app').removeAttribute('aria-busy');
      }
    </script>
    <noscript>
      <p class="boot">Esta aplicación necesita JavaScript. Actívelo en su navegador.</p>
    </noscript>
  </body>
</html>
